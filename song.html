<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Only For You 💖</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  background:linear-gradient(135deg,#ff5f9e,#ff9acb);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Floating Hearts */
.heart{
  position:absolute;
  font-size:24px;
  animation:float 6s linear infinite;
  opacity:0.7;
}

@keyframes float{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

.h1{left:15%;animation-delay:0s;}
.h2{left:35%;animation-delay:2s;}
.h3{left:60%;animation-delay:4s;}
.h4{left:80%;animation-delay:1s;}

/* Main Box */
.container{
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(12px);
  padding:50px 35px;
  border-radius:25px;
  text-align:center;
  width:90%;
  max-width:450px;
  box-shadow:0 10px 35px rgba(0,0,0,0.25);
  color:white;
  z-index:2;
}

h1{
  font-size:30px;
  margin-bottom:25px;
}

.lyrics{
  font-size:24px;
  line-height:1.8;
  min-height:120px;
  font-weight:600;
  animation:fade 0.6s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(15px);}
  to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<!-- Hearts -->
<div class="heart h1">💖</div>
<div class="heart h2">💕</div>
<div class="heart h3">💗</div>
<div class="heart h4">💘</div>

<!-- Main -->
<div class="container">

  <h1>Only For You 💝</h1>

  <div class="lyrics" id="lyrics">
    💗 Wait for magic...
  </div>

</div>

<!-- Hidden Audio -->
<audio id="song" src="assets/song.mp3"></audio>

<script>
const song = document.getElementById("song");
const lyricsBox = document.getElementById("lyrics");

const timedLyrics = [
  { text:"Kya khub lagti ho 💖", time:0 },
  { text:"Badi sundar dikhti ho 😍", time:3.6 },
  { text:"Kya khub lagti ho 💕", time:6.4 },
  { text:"Badi sundar dikhti ho 💗", time:10 },
];

let index = 0;
let started = false;

/* Show start button if autoplay fails */
function showStart(){
  lyricsBox.innerHTML = `
    <button style="
      background:#ff4f8b;
      border:none;
      padding:14px 30px;
      border-radius:30px;
      font-size:18px;
      color:white;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(0,0,0,0.3);
    ">💖 Start 💖</button>
  `;
}

/* Start song manually */
document.body.addEventListener("click",()=>{
  if(!started){
    song.play();
    started = true;
  }
});

/* Try autoplay */
window.onload = () => {
  song.play().then(()=>{
    started = true;
  }).catch(showStart);
};

/* Sync lyrics */
song.addEventListener("timeupdate",()=>{
  if(index < timedLyrics.length &&
     song.currentTime >= timedLyrics[index].time){

    lyricsBox.innerText = timedLyrics[index].text;

    lyricsBox.classList.remove("fade");
    void lyricsBox.offsetWidth;
    lyricsBox.classList.add("fade");

    index++;
  }
});
</script>

</body>
</html>
